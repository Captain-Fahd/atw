# atw boot menu. live-build replaces the LINUX_LIVE placeholder below with the live entries,
# whose kernel command line comes from --bootappend-live in lb-build.sh.
set default=0
set timeout=5
insmod all_video

@LINUX_LIVE@

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" --hotkey=f {
		fwsetup
	}
fi
